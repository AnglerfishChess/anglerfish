[project]
name = "anglerfish"
version = "0.1.0"
description = "AI-based chess toolkit"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Alexander Myodov", email = "amyodov@gmail.com" },
]
dependencies = [
    "esca",
    # torch 2.2 is the last x86-macOS build, and it is compiled against NumPy 1.
    "numpy>=1.26,<2",
    "torch>=2.2.2,<2.3",
]

[dependency-groups]
dev = [
    "ipython>=9.0.1",
]
test = [
    "pytest>=8.3.5",
]

[tool.uv.sources]
esca = { path = "rs_anglerfish/esca", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyanglerfish"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pyrefly]
python-version = "3.12"
search-path = [".", "tests"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests", "rs_anglerfish/esca/python/tests"]
