[project]
name = "anglerfish"
version = "0.1.0"
description = "AI-based chess toolkit"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Alexander Myodov", email = "amyodov@gmail.com" },
]
dependencies = [
    "aiohttp>=3.11.13,<4",
    "stockfish>=3.28.0,<4",
    "torch>=2.2.2,<2.3",
    "zstandard>=0.23.0,<1",
]

[dependency-groups]
dev = [
    "ipython>=9.0.1",
]
test = [
    "pytest>=8.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyanglerfish"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pyrefly]
python-version = "3.12"

[tool.pytest.ini_options]
addopts = "-ra"
