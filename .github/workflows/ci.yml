name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: rs_anglerfish

jobs:
  python:
    # The differential reference is standard library only, so the project's own
    # dependencies are not installed.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --only-group test --no-install-project
      # The trainer tests need `esca` and torch, so they run in `esca-python`.
      # `-n auto` overrides the local `-n 4` of the pytest addopts.
      - run: uv run --no-sync pytest tests --ignore=tests/trainer -n auto
      - run: uvx ruff check tests
      - run: uvx ruff format --check tests
      - run: uvx pyrefly check tests/reference tests/test_reference_v0.py

  esca-python:
    # The wheel is built from the crate by maturin, so this job needs cargo.
    # It is also the only job with the built `esca` and torch, so the trainer
    # and the whole repository's type check belong here.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs_anglerfish
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run --no-sync pytest rs_anglerfish/esca/python/tests tests/trainer -n auto
      - run: uvx ruff check .
      - run: uvx ruff format --check .
      - run: uvx pyrefly check

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Pinned to the workspace's rust-version so clippy findings are reproducible.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs_anglerfish
      - run: cargo build --release
      - run: cargo test
      - run: cargo test --features lichess
      - run: cargo test --features pgn
      - run: cargo test --features uci
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings

  perft:
    # Billions of nodes: once per run, not once per platform.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs_anglerfish
      - run: cargo test --release -- --ignored

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs_anglerfish
      - uses: astral-sh/setup-uv@v5
      - run: cargo build --release
      # The engine must stay a conformant UCI citizen at every level it declares.
      - run: uvx uci-test-suite ./target/release/anglerfish

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs_anglerfish
      - name: Every dependency carries a permissive licence
        run: |
          cat > check_licences.py <<'PY'
          import json, sys

          ALLOWED = {
              "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
              "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "BSL-1.0",
              "Unlicense", "0BSD", "CC0-1.0",
          }

          bad = []
          for package in json.load(sys.stdin)["packages"]:
              expression = (package.get("license") or "").replace("/", " OR ")
              terms = [t.strip(" ()") for t in expression.split(" OR ")]
              if not any(t in ALLOWED for t in terms):
                  bad.append("%s %s | %s" % (package["name"], package["version"],
                                             package.get("license")))
          print("\n".join(bad) if bad else "every dependency is permissive")
          sys.exit(1 if bad else 0)
          PY
          cargo metadata --format-version 1 --all-features | python3 check_licences.py
