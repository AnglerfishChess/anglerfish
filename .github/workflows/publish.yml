# Runs when a GitHub release is published. One release reaches two indexes,
# both by trusted publishing (OIDC, no token stored): the `esca` crate on
# crates.io (environment `crates`) and the `esca` wheels and sdist on PyPI
# (environment `pypi`). The crates job is gated on the CRATES_PUBLISH repo
# variable, so the bootstrap — first manual publish, then registering the
# trusted publisher — can happen before the pipeline arms.
name: Publish

on:
  release:
    types: [published]
  # Dry run: builds every artifact and proves the OIDC exchange, publishes
  # nothing.
  workflow_dispatch:

jobs:
  crate:
    if: vars.CRATES_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: rs_anglerfish
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.1"

      - name: Verify the crate version matches the release tag
        if: github.event_name == 'release'
        run: |
          want="${GITHUB_REF_NAME#v}"
          got="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "esca"))')"
          [ "$got" = "$want" ] || { echo "crate $got != tag $want" >&2; exit 1; }
          # esca/pyproject.toml declares the version dynamic, so maturin reads
          # it from Cargo.toml and one string serves both. A static version
          # there is a second source and must agree.
          py="$(python3 -c 'import tomllib; print(tomllib.load(open("esca/pyproject.toml", "rb"))["project"].get("version", ""))')"
          [ -z "$py" ] || [ "$py" = "$want" ] || { echo "pyproject $py != tag $want" >&2; exit 1; }

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - if: github.event_name == 'release'
        run: cargo publish -p esca
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - if: github.event_name == 'workflow_dispatch'
        run: cargo publish -p esca --dry-run
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  wheels:
    name: wheels (${{ matrix.platform.runner }} ${{ matrix.platform.target }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          # `native` marks the wheel the runner itself can import; the other
          # two are cross-built and only checked for shape.
          - runner: ubuntu-latest
            target: x86_64
            native: true
          - runner: ubuntu-latest
            target: aarch64
          - runner: macos-latest
            target: x86_64
          - runner: macos-latest
            target: aarch64
            native: true
          - runner: windows-latest
            target: x64
            native: true
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      # One abi3-py312 wheel per platform: the extension is built against the
      # stable ABI, so the Python version on the runner does not select it.
      # The feature set is the one esca/pyproject.toml declares; naming it
      # here again would let the two drift.
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: rs_anglerfish/esca
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: auto
          sccache: "true"
      # A wheel that installs but lacks a module is the failure the version
      # check cannot see: import every module the wheel must carry.
      - if: matrix.platform.native
        uses: astral-sh/setup-uv@v5
      - if: matrix.platform.native
        shell: bash
        run: |
          uv run --isolated --no-project --python 3.12 \
            --with "$(ls rs_anglerfish/esca/dist/esca-*.whl)" \
            python -c "import esca, esca.explain, esca.lichess, esca.openings, esca.pgn, esca.polyglot, esca.uci; print(esca.SCHEMA_ID)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: rs_anglerfish/esca/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: rs_anglerfish/esca
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: rs_anglerfish/esca/dist

  pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@v5

      # The artifact versions come from esca/pyproject.toml as maturin
      # resolved it; the crate job checks Cargo.toml against the same tag.
      - name: Verify the artifact versions match the release tag
        if: github.event_name == 'release'
        run: |
          want="${GITHUB_REF_NAME#v}"
          got="$(basename dist/esca-*.tar.gz .tar.gz | sed -E 's/^esca-//')"
          [ "$got" = "$want" ] || { echo "sdist $got != tag $want" >&2; exit 1; }
          for wheel in dist/*.whl; do
            got="$(basename "$wheel" | cut -d- -f2)"
            [ "$got" = "$want" ] || { echo "$wheel is not version $want" >&2; exit 1; }
          done

      - name: Every artifact is well formed
        run: uvx twine check dist/*

      - if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1
