name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

defaults:
  run:
    working-directory: rs_anglerfish

jobs:
  exhaustive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs_anglerfish
      # The sweeps `cargo test` leaves out; minutes long, hence release.
      - run: cargo test --release -- --ignored
