[package]
name = "anglerfish-core"
version = "0.2.0"
description = "The Anglerfish chess engine: the UCI front end, the search, and the evaluator interface a net plugs into."
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "anglerfish"
path = "src/main.rs"

[dependencies]
env_logger = "0.11"
esca = { path = "../esca" }
log = "0.4"
rand = "0.10"

[dev-dependencies]
proptest = "1"
